server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    # El build genera admin.html, no index.html.
    index admin.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Portal interno: fuera de buscadores.
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;

    location / {
        try_files $uri $uri/ /admin.html;
    }

    # admin.html decide qué bundle corre: sin caché. Se repiten las cabeceras porque
    # un add_header en location anula las heredadas del server.
    location = /admin.html {
        add_header Cache-Control "no-cache, must-revalidate" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
