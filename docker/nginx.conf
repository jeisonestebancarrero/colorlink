server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # SPA: toda ruta desconocida cae en index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # index.html NUNCA se cachea.
    #
    # Es el único archivo con nombre fijo, y es el que dice qué bundle cargar.
    # Sin esta cabecera el navegador lo servía de su caché sin preguntar, así
    # que tras un despliegue un visitante que ya conocía la tienda seguía
    # ejecutando el bundle anterior: el arreglo estaba publicado y él no lo
    # recibía. Los archivos de /assets/ sí llevan el hash en el nombre, y por
    # eso pueden cachearse para siempre sin riesgo.
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
