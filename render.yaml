# Dos sitios estáticos separados para que el cliente no reciba el bundle del portal.
# La base (Supabase Cloud) y las funciones (`supabase functions deploy`) se despliegan aparte.
# Las VITE_* se leen al compilar: si cambian, hay que reconstruir el sitio.
# Registrar ambas URL en Supabase Auth y en Google, o el ingreso con Google falla en Render.

services:
  # Tienda del cliente.
  - name: colorlink-tienda
    type: web
    runtime: static
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    envVars:
      # sync: false: Render las pide al crear el blueprint; varían por entorno.
      - key: VITE_SUPABASE_URL
        sync: false
      - key: VITE_SUPABASE_ANON_KEY
        sync: false
    routes:
      # SPA: sin esta reescritura, recargar una ruta interna da 404.
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin

  # Portal interno.
  - name: colorlink-portal
    type: web
    runtime: static
    buildCommand: npm ci && npm run build:admin
    # Este build genera admin.html (ver vite.admin.config.ts), no index.html.
    staticPublishPath: ./dist-admin
    envVars:
      - key: VITE_SUPABASE_URL
        sync: false
      - key: VITE_SUPABASE_ANON_KEY
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /admin.html
    headers:
      # Portal interno: fuera de buscadores.
      - path: /*
        name: X-Robots-Tag
        value: noindex, nofollow
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
