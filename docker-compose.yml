# Proyecto aislado: no comparte red, volúmenes ni puertos con odoo15/odoo18/ancla.
name: electica-vl

services:
  colorlink:
    build:
      context: .
      dockerfile: docker/Dockerfile
      args:
        # Compose las toma del .env junto a este archivo.
        VITE_SUPABASE_URL: ${VITE_SUPABASE_URL:?falta VITE_SUPABASE_URL en .env}
        VITE_SUPABASE_ANON_KEY: ${VITE_SUPABASE_ANON_KEY:?falta VITE_SUPABASE_ANON_KEY en .env}
    image: electica-vl/colorlink:latest
    container_name: electicavl_colorlink
    restart: unless-stopped
    ports:
      # Solo localhost; 8090 no choca con odoo (8069/8070) ni ancla (3000/5555).
      - "127.0.0.1:8090:80"
    networks:
      - electicavl_net

  # Portal interno: imagen, bundle y puerto propios; solo comparte la base con la tienda.
  admin:
    build:
      context: .
      dockerfile: docker/Dockerfile.admin
      args:
        VITE_SUPABASE_URL: ${VITE_SUPABASE_URL:?falta VITE_SUPABASE_URL en .env}
        VITE_SUPABASE_ANON_KEY: ${VITE_SUPABASE_ANON_KEY:?falta VITE_SUPABASE_ANON_KEY en .env}
    image: electica-vl/colorlink-admin:latest
    container_name: electicavl_admin
    restart: unless-stopped
    ports:
      - "127.0.0.1:8091:80"
    networks:
      - electicavl_net

networks:
  electicavl_net:
    name: electicavl_net
    driver: bridge
